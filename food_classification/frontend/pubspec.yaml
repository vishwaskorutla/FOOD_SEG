name: food_classifier_frontend
description: "A premium Flutter application for the Indian Food Classifier."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase dependencies
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_functions: ^5.1.1

  # HTTP client
  http: ^1.2.1

  # Image picker for choosing image from gallery or capturing from camera
  image_picker: ^1.1.2

  # Modern and polished typography
  google_fonts: ^6.2.1

  # Cupertino icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
